<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Explore the IEEE student chapters at Temple University: EMBS, PES, and WIE.">
    <title>Chapters | Temple IEEE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" type="image/png" href="../favicon.png">
</head>
<body class="site-theme chapters-page" data-chapter-palette="ieee">
    <nav>
        <a href="../index.html" class="logo" aria-label="Temple IEEE home">Temple <span>IEEE</span></a>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../pages/board.html">Board</a></li>
            <li><a href="../pages/events.html">Events</a></li>
            <li><a href="../pages/chapters.html" class="active">Chapters</a></li>
        </ul>
        <button class="mobile-toggle" aria-label="Toggle navigation">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
    </nav>

    <main class="chapter-hub">
        <div class="site-circuit-backdrop site-circuit-backdrop--chapters" aria-hidden="true">
            <svg class="site-circuit-symbol site-circuit-symbol--1" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-resistor"></use></svg>
            <svg class="site-circuit-symbol site-circuit-symbol--2" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-inductor"></use></svg>
            <svg class="site-circuit-symbol site-circuit-symbol--3" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-diode"></use></svg>
            <svg class="site-circuit-symbol site-circuit-symbol--4" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-sine"></use></svg>
            <svg class="site-circuit-symbol site-circuit-symbol--5" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-waveform"></use></svg>
            <svg class="site-circuit-symbol site-circuit-symbol--6" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-capacitor"></use></svg>
            <svg class="site-circuit-symbol site-circuit-symbol--7" focusable="false"><use href="../assets/images/home/circuit-symbols.svg#circuit-gate"></use></svg>
        </div>
        <h1 class="chapter-hub__title">Find your chapter.</h1>
        <section class="chapter-map" aria-label="Temple IEEE chapters">
            <a class="chapter-parent" href="../index.html" data-chapter-card data-palette="ieee" aria-label="Visit the Temple IEEE home page">
                <span class="chapter-parent__mark">
                    <img src="../favicon.png" alt="" width="124" height="124">
                </span>
                <span class="chapter-parent__copy">
                    <strong>Temple IEEE</strong>
                    <span>Student Branch</span>
                </span>
            </a>

            <div class="chapter-grid">
                <a class="chapter-card chapter-card--embs" href="../pages/embs.html" data-chapter-card data-palette="embs">
                    <span class="chapter-card__image">
                        <img src="../assets/images/chapter/EMBS.jpg" alt="IEEE Engineering in Medicine and Biology Society logo" width="152" height="152">
                    </span>
                    <span class="chapter-card__copy">
                        <strong>EMBS</strong>
                        <span>Engineering in Medicine &amp; Biology Society</span>
                    </span>
                </a>

                <a class="chapter-card chapter-card--pes" href="../pages/pes.html" data-chapter-card data-palette="pes">
                    <span class="chapter-card__image">
                        <img src="../assets/images/chapter/PES.jpg" alt="IEEE Power and Energy Society logo" width="152" height="152">
                    </span>
                    <span class="chapter-card__copy">
                        <strong>PES</strong>
                        <span>Power &amp; Energy Society</span>
                    </span>
                </a>

                <a class="chapter-card chapter-card--wie" href="../pages/wie.html" data-chapter-card data-palette="wie">
                    <span class="chapter-card__image">
                        <img src="../assets/images/chapter/WIE.jpg" alt="IEEE Women in Engineering logo" width="152" height="152">
                    </span>
                    <span class="chapter-card__copy">
                        <strong>WIE</strong>
                        <span>Women in Engineering</span>
                    </span>
                </a>
            </div>
        </section>
    </main>

    <footer data-site-footer aria-label="Site footer"></footer>

    <div class="chapter-click-cursor" aria-hidden="true">CLICK</div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
